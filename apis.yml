aid: amazon-iot-core
name: Amazon IoT Core
description: AWS IoT Core is a managed cloud service that lets connected devices easily
  and securely interact with cloud applications and other devices. It can support
  billions of devices and trillions of messages, routing those messages to AWS endpoints
  and other devices reliably and securely.
