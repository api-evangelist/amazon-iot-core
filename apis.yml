- type: Features
  data:
  - name: Secure Device Connectivity
    description: Connects IoT devices to AWS using MQTT, HTTPS, and WebSocket protocols
      with mutual TLS authentication.
  - name: Message Broker
    description: Scales to billions of messages per day with a fully managed MQTT
      message broker.
  - name: Rules Engine
    description: Routes device messages to 15+ AWS services based on SQL-like rules.
  - name: Device Shadow
    description: Maintains a persistent virtual representation of each device for
      state management.
  - name: Fleet Indexing
    description: Index and search all IoT things and their attributes at scale.
- type: UseCases
  data:
  - name: Industrial IoT
    description: Connect factory equipment to AWS for real-time monitoring and predictive
      maintenance.
  - name: Smart Home
    description: Build connected home devices with secure two-way communication.
  - name: Asset Tracking
    description: Track vehicles, equipment, and assets with GPS and sensor data.
- type: Integrations
  data:
  - name: AWS Lambda
    description: Trigger serverless functions from IoT device messages with Rules
      Engine.
  - name: Amazon Kinesis
    description: Stream IoT telemetry data to Kinesis for real-time analytics.
  - name: Amazon S3
    description: Store device messages and data in S3 using IoT Rules.
  - name: Amazon DynamoDB
    description: Write device state data to DynamoDB tables with IoT Rules.
