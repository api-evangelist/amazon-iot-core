openapi: 3.2.0
info:
  title: Amazon IoT Core Shadows API
  description: The Amazon IoT Core API enables programmatic management of IoT resources including things, thing types, thing groups, certificates, policies, rules, jobs, and device shadows for connecting and managing IoT devices at scale.
  version: '2015-05-28'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
servers:
- url: https://iot.{region}.amazonaws.com
  description: Amazon IoT Core regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - ap-northeast-1
      - ap-northeast-2
      - ap-southeast-1
      - ap-southeast-2
      - ap-south-1
      - sa-east-1
      - ca-central-1
security:
- sigv4: []
tags:
- name: Shadows
  description: Operations for managing device shadows
paths:
  /things/{thingName}/shadow:
    get:
      operationId: GetThingShadow
      summary: Amazon IoT Core Get thing shadow
      description: Gets the shadow for the specified thing.
      tags:
      - Shadows
      parameters:
      - name: thingName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Thing shadow
components:
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication
